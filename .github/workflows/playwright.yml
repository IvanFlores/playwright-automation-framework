name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # The app under test (GAD) runs next to the job, so CI does not depend on anyone's local machine.
    services:
      gad:
        image: jaktestowac/gad:2.9.0
        ports:
          - 3001:3000

    env:
      BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Wait for GAD to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL/login/"; then echo "GAD is up"; exit 0; fi
            sleep 2
          done
          echo "GAD did not start in time" >&2
          exit 1

      # A fresh, throwaway account per run: no credentials are stored in the repository or in secrets.
      - name: Create CI test user in GAD
        run: |
          email="ci.runner.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}@example.test"
          password="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          body=$(jq -n --arg e "$email" --arg p "$password" \
            '{firstname: "CI", lastname: "Runner", email: $e, password: $p,
              avatar: ".\\data\\users\\face_1591133479.7144732.jpg"}')
          status=$(curl -s -o response.json -w '%{http_code}' -X POST "$BASE_URL/api/users" \
            -H 'Content-Type: application/json' -d "$body")
          if [ "$status" != "201" ]; then
            echo "User creation failed with HTTP $status" >&2
            cat response.json >&2
            exit 1
          fi
          echo "TEST_USERNAME=$email" >> "$GITHUB_ENV"
          echo "TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium UI + API)
        run: npx playwright test --project=chromium --project=api

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
